name: space-eye
services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: spaceeye
      POSTGRES_USER: spaceeye
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spaceeye -d spaceeye"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
  migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    env_file: .env
    environment: &processing-env
      DATABASE_URL: postgresql+psycopg://spaceeye:${POSTGRES_PASSWORD}@postgres:5432/spaceeye
      REDIS_URL: redis://redis:6379/0
      STORAGE_DIR: /app/data/storage
      MODEL_DIR: /app/data/checkpoints
    depends_on:
      postgres: {condition: service_healthy}
    command: ["alembic", "-c", "backend/alembic.ini", "upgrade", "head"]
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    env_file: .env
    environment: *processing-env
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    ports: ["127.0.0.1:8000:8000"]
    volumes: ["research-data:/app/data"]
    restart: unless-stopped
  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    env_file: .env
    environment: *processing-env
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    command: ["celery", "-A", "backend.app.worker.celery", "worker", "--loglevel=INFO", "--concurrency=1"]
    volumes: ["research-data:/app/data"]
    restart: unless-stopped
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    environment:
      SCIENCE_API_URL: http://api:8000
      SPACE_EYE_STANDALONE: "true"
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [api]
    restart: unless-stopped
volumes:
  postgres-data:
  redis-data:
  research-data:
